<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blender Cinema Master Academy</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <button id="menuBtn" class="icon" aria-label="Afficher le sommaire">☰</button>
  <a href="#home" class="brand">Blender Cinema Master Academy</a>
  <form class="search" id="globalSearch" role="search" aria-label="Bibliothèque">
    <input id="q" type="search" placeholder="Chercher dans la bibliothèque" aria-label="Chercher dans la bibliothèque" required minlength="2" maxlength="150">
    <button class="btn" type="submit">Chercher</button>
  </form>
  <span id="progressBadge" class="badge" aria-live="polite"></span>
</header>
<div class="layout">
  <nav id="nav" aria-label="Sommaire"></nav>
  <main id="main" tabindex="-1"></main>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
